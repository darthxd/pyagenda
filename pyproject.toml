[project]
name = "pyagenda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.4",
    "pydantic[latest]>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
pyagenda = "pyagenda:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
